name: Update map data

on:
  schedule:
    - cron: "25 */3 * * *"   # every 3 hours (WPC fronts are issued every 3 h)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python tests/test_fronts.py && node tests/test_lib.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Build data files
        env:
          GCP_BILLING_PROJECT: ${{ secrets.GCP_BILLING_PROJECT }}
        run: |
          mkdir -p site/data
          python scripts/fronts.py --out site/data/fronts.json
          python scripts/generate_data.py --out site/data

      # Publish only the finished site to the `deploy` branch (one fresh commit each run, so the
      # repo history doesn't fill with data files). Render serves that branch.
      - name: Publish to deploy branch
        run: |
          cd site
          git init -q -b deploy
          git config user.name  "wx-map bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -f .
          git commit -q -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
